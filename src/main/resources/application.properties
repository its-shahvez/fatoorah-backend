spring.application.name=fatoorah-backend
server.port=${PORT:8080}

# Persistent H2 File Database (Server band karne par bhi data save rahega)
spring.datasource.url=jdbc:h2:file:./data/fatoorah_pro_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Live SQL Browser Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

